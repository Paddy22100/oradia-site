name: Build app iOS (Oradia)

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build iOS (vérification + archive si signature configurée)
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Synchroniser le projet natif iOS
        run: npx --no-install cap sync ios

      # Toujours exécuté, sans signature requise : compile l'app pour le
      # simulateur iOS. Ne produit rien d'installable sur un vrai iPhone ni de
      # fichier envoyable à l'App Store, mais confirme que le projet compile
      # correctement à chaque changement — utile pour détecter tout de suite
      # une régression, sans attendre d'avoir un compte Apple Developer.
      - name: Build de vérification (simulateur, non signé)
        working-directory: mobile-app/ios/App
        run: |
          xcodebuild -workspace App.xcodeproj/project.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          # Cette étape échoue explicitement si xcodebuild a échoué (le tee ci-dessus
          # masque sinon le vrai code de sortie derrière celui de tee) — sans ça, le
          # message "exit code 65" générique de GitHub ne dit pas où chercher.
          exit ${PIPESTATUS[0]}

      - name: Afficher les erreurs de compilation (si échec)
        if: failure()
        working-directory: mobile-app/ios/App
        run: |
          echo "── Lignes contenant 'error' dans le journal xcodebuild ──"
          grep -i "error" "$RUNNER_TEMP/xcodebuild.log" || echo "(aucune ligne 'error' trouvée — voir le journal complet ci-dessus)"

      # Archive signée + export .ipa, prêt pour TestFlight/App Store — ne se
      # déclenche que si le certificat de distribution et le profil de
      # provisionnement ont été ajoutés dans les secrets du dépôt (voir
      # mobile-app/README.md, section "Signer l'app iOS"). Tant que ces
      # secrets ne sont pas configurés, cette étape est ignorée : le build de
      # vérification ci-dessus continue de fonctionner normalement.
      - name: Importer le certificat et le profil de provisionnement
        if: ${{ vars.HAS_IOS_SIGNING == 'true' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/oradia-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/oradia.mobileprovision

      - name: Archive signée (Release)
        if: ${{ vars.HAS_IOS_SIGNING == 'true' }}
        working-directory: mobile-app/ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -workspace App.xcodeproj/project.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            archive

      - name: Export .ipa
        if: ${{ vars.HAS_IOS_SIGNING == 'true' }}
        working-directory: mobile-app/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Publier l'ipa
        if: ${{ vars.HAS_IOS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: oradia.ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 90
