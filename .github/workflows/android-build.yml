name: Build app Android (Oradia)

on:
  # Automatique : à chaque modification du dossier de l'app mobile
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android-build.yml'
  # Manuel : depuis l'onglet Actions sur GitHub
  workflow_dispatch:

permissions:
  contents: write  # requis pour publier/mettre à jour la GitHub Release (APK en téléchargement direct)

jobs:
  build:
    name: Build APK / AAB Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Synchroniser le projet natif Android
        # --no-install force npx à utiliser le binaire déjà installé localement
        # (node_modules/.bin/cap) plutôt que de risquer une résolution ambiguë
        # (npx peut, dans un shell non interactif, essayer de récupérer un tout
        # autre paquet npm nommé "cap" si la résolution locale ne se déclenche
        # pas comme attendu — origine probable de l'échec instantané observé).
        run: npx --no-install cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Toujours produit : un APK debug, installable directement sur un téléphone
      # (Android > Paramètres > autoriser les sources inconnues) pour tester
      # l'app sans passer par le Play Store — pratique pour vérifier chaque
      # changement avant de préparer une vraie publication.
      - name: Build APK debug
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: oradia-debug.apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Build signé (.aab), prêt à être envoyé sur Google Play Console — ne se
      # déclenche que si le keystore de signature a été ajouté dans les secrets
      # du dépôt (voir mobile-app/README.md, section "Signer l'app Android").
      # Tant que ces secrets ne sont pas configurés, cette étape est simplement
      # ignorée : le build debug ci-dessus continue de fonctionner normalement.
      - name: Décoder le keystore de signature
        if: ${{ vars.HAS_ANDROID_SIGNING == 'true' }}
        working-directory: mobile-app/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build AAB signé (release)
        if: ${{ vars.HAS_ANDROID_SIGNING == 'true' }}
        working-directory: mobile-app/android
        env:
          ORADIA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORADIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORADIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Publier l'AAB signé
        if: ${{ vars.HAS_ANDROID_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: oradia-release.aab
          path: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      # APK signé (distinct de l'AAB, réservé au Play Store) : permet un
      # téléchargement/installation directe depuis oradia.fr, en complément du
      # Play Store — réduit la dépendance à Google pour les personnes qui
      # préfèrent éviter le Store (ex. téléphones "dégooglisés").
      - name: Build APK release signé (téléchargement direct)
        if: ${{ vars.HAS_ANDROID_SIGNING == 'true' }}
        working-directory: mobile-app/android
        env:
          ORADIA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORADIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORADIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Renommé pour une URL de téléchargement lisible (oradia.apk plutôt que
      # le nom générique app-release.apk).
      - name: Renommer l'APK pour le téléchargement direct
        if: ${{ vars.HAS_ANDROID_SIGNING == 'true' }}
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/oradia.apk

      - name: Publier l'APK release signé (artifact)
        if: ${{ vars.HAS_ANDROID_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: oradia-release.apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # Publie/actualise une GitHub Release avec un tag fixe ("android-latest") :
      # l'URL de l'asset reste stable d'une version à l'autre, donc le bouton de
      # téléchargement sur oradia.fr n'a jamais besoin d'être changé.
      - name: Publier l'APK en téléchargement direct (GitHub Release)
        if: ${{ vars.HAS_ANDROID_SIGNING == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Oradia — dernière version Android (APK)"
          body: |
            APK signé, généré et mis à jour automatiquement à chaque nouvelle version de l'app mobile Oradia.
            À installer manuellement (Android : autoriser "sources inconnues" pour l'app utilisée pour l'ouvrir), en alternative au Google Play Store.
            Version : ${{ github.sha }}
          files: mobile-app/android/app/build/outputs/apk/release/oradia.apk
