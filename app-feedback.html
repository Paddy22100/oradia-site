<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signaler un problème ou une idée – ORADIA</title>
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="images/logo-hd-v2.webp">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --night: #0a192f; --night-deep: #050d1c; --gold: #d4af37; --light-gold: #f5e7a1; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: linear-gradient(rgba(5,13,28,0.55), rgba(3,8,17,0.94) 55%, #030811), url('images/oradia-hero-4k.webp');
    background-size: cover; background-position: center 30%; background-repeat: no-repeat;
    font-family: 'Lora', Georgia, serif; color: #e8e4d4;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 22px max(40px, env(safe-area-inset-bottom)); }
  a.back {
    display: inline-flex; align-items: center; gap: 6px; color: var(--gold);
    text-decoration: none; font-family: 'Lora', Georgia, serif; font-size: 14px; font-weight: 600;
    margin-bottom: 22px;
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 26px;
    margin: 0 0 6px; color: var(--light-gold);
  }
  .intro { margin: 0 0 24px; font-size: 13.5px; line-height: 1.5; color: rgba(232,228,212,0.7); text-align: center; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn {
    flex: 1; padding: 11px 8px; border-radius: 12px; border: 1px solid rgba(212,175,55,0.3);
    background: rgba(5,20,40,0.6); color: rgba(232,228,212,0.7); font-family: 'Lora', Georgia, serif;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .tab-btn.active { background: rgba(212,175,55,0.15); border-color: rgba(212,175,55,0.7); color: var(--light-gold); }

  .panel { display: none; }
  .panel.active { display: block; }

  label { display: block; font-size: 12.5px; color: rgba(212,175,55,0.8); margin: 0 0 6px; letter-spacing: 0.03em; }
  .field { margin-bottom: 16px; }
  input, select, textarea {
    width: 100%; background: rgba(5,20,40,0.8); border: 1px solid rgba(212,175,55,0.3);
    border-radius: 12px; padding: 13px 14px; color: #e8e4d4; font-family: 'Lora', Georgia, serif;
    font-size: 14.5px; outline: none;
  }
  input::placeholder, textarea::placeholder { color: rgba(232,228,212,0.35); }
  input:focus, select:focus, textarea:focus { border-color: rgba(212,175,55,0.7); }
  textarea { resize: none; }

  button[type="submit"] {
    width: 100%; padding: 15px; border-radius: 50px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--gold), var(--light-gold)); color: var(--night-deep);
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 16px;
    letter-spacing: 0.06em;
  }
  button[type="submit"]:disabled { opacity: 0.6; cursor: default; }

  .feedback-msg { display: none; margin: 0 0 16px; padding: 12px 16px; border-radius: 12px; font-size: 13.5px; }
  .feedback-msg.success { background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.35); color: #86efac; }
  .feedback-msg.error { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.35); color: #fca5a5; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="app-home.html"><i class="fas fa-chevron-left" style="font-size:12px;"></i> Accueil</a>

    <h1>Un problème ? Une idée ?</h1>
    <p class="intro">Oradia est en version bêta. Vos retours m'aident directement à corriger les bugs et améliorer l'app.<br>Merci de prendre le temps de les partager.</p>

    <div class="tabs">
      <button type="button" class="tab-btn active" id="tab-probleme" onclick="showTab('probleme')">Signaler un problème</button>
      <button type="button" class="tab-btn" id="tab-idee" onclick="showTab('idee')">Proposer une idée</button>
    </div>

    <div id="feedbackMsg" class="feedback-msg"></div>

    <div id="panel-probleme" class="panel active">
      <form onsubmit="submitForm(event, 'support')">
        <div class="field">
          <label>De quoi s'agit-il ?</label>
          <select name="sujet" required>
            <option value="">— Choisir —</option>
            <option value="technique">Bug / problème technique</option>
            <option value="tirage">Souci pendant un tirage</option>
            <option value="paiement">Problème de paiement</option>
            <option value="compte">Mon compte / abonnement</option>
            <option value="autre">Autre</option>
          </select>
        </div>
        <div class="field">
          <label>Décrivez le problème</label>
          <textarea name="message" required rows="5" placeholder="Ce qui s'est passé, à quel moment, ce que vous attendiez à la place…"></textarea>
        </div>
        <div class="field">
          <label>Votre email <span style="opacity:0.5;font-weight:400;">(pour vous répondre)</span></label>
          <input type="email" name="email" required placeholder="votre@email.fr">
        </div>
        <button type="submit">Envoyer</button>
      </form>
    </div>

    <div id="panel-idee" class="panel">
      <form onsubmit="submitForm(event, 'suggestion')">
        <div class="field">
          <label>Catégorie</label>
          <select name="categorie" required>
            <option value="">— Choisir —</option>
            <option value="fonctionnalite">Nouvelle fonctionnalité</option>
            <option value="ux">Interface / Expérience</option>
            <option value="tirage">Nouveaux types de tirages</option>
            <option value="contenu">Contenu des interprétations</option>
            <option value="autre">Autre</option>
          </select>
        </div>
        <div class="field">
          <label>Votre idée</label>
          <textarea name="message" required rows="5" placeholder="Décrivez votre idée ou ce qui manque selon vous…"></textarea>
        </div>
        <div class="field">
          <label>Votre email <span style="opacity:0.5;font-weight:400;">(optionnel, pour vous répondre)</span></label>
          <input type="email" name="email" placeholder="votre@email.fr">
        </div>
        <button type="submit">Envoyer</button>
      </form>
    </div>
  </div>

  <script>
    function showTab(tab) {
      ['probleme', 'idee'].forEach(function (t) {
        document.getElementById('panel-' + t).classList.toggle('active', t === tab);
        document.getElementById('tab-' + t).classList.toggle('active', t === tab);
      });
      var msg = document.getElementById('feedbackMsg');
      msg.style.display = 'none';
    }

    async function submitForm(e, type) {
      e.preventDefault();
      var form = e.target;
      var btn = form.querySelector('button[type=submit]');
      var msg = document.getElementById('feedbackMsg');
      var origBtnText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Envoi…';
      msg.style.display = 'none';

      var data = { type: type };
      new FormData(form).forEach(function (v, k) { data[k] = v; });
      if (!data.email) data.email = 'sans-email@oradia.fr';

      try {
        var res = await fetch('/api/support', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error();
        msg.className = 'feedback-msg success';
        msg.textContent = type === 'support'
          ? 'Merci, message reçu — je regarde ça au plus vite.'
          : 'Merci pour votre idée, elle nourrit l\'évolution d\'Oradia !';
        msg.style.display = 'block';
        form.reset();
      } catch (err) {
        msg.className = 'feedback-msg error';
        msg.textContent = 'Erreur d\'envoi. Réessayez, ou écrivez à contact@oradia.fr.';
        msg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = origBtnText;
      }
    }
  </script>
</body>
</html>
